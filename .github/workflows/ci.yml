name: CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Select runner
        id: check
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          RUNNER_TARGET: ${{ vars.RUNNER_TARGET }}
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          if [ "$REPO_VISIBILITY" != "public" ]; then
            # Hosted runners are billed on a non-public repo, so routing is not a
            # preference here and RUNNER_TARGET deliberately does not apply.
            RUNNER=d-sorg-fleet
            WHY="repository is '${REPO_VISIBILITY:-unknown}'; hosted runners are metered"
          elif [ "$RUNNER_TARGET" = "local" ]; then
            RUNNER=d-sorg-fleet
            WHY="repository is public but RUNNER_TARGET=local"
          else
            RUNNER=ubuntu-latest
            WHY="repository is public; hosted runners are free and keep fork PRs off the fleet"
          fi
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"
          echo "Routing to $RUNNER ($WHY)."
  build-and-test:
    timeout-minutes: 90
    name: quality-gate
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # System toolchain (cmake, build-essential, GL headers) via apt.
          # gcovr is installed via pip so we control the version — apt-provided
          # gcovr bundles an old template engine that breaks on modern jinja2
          # (ImportError: cannot import name 'Markup' from 'jinja2').
          PIP_BREAK_SYSTEM_PACKAGES=""
          if python3 -m pip install --help | grep -q -- '--break-system-packages'; then
            PIP_BREAK_SYSTEM_PACKAGES="--break-system-packages"
          fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get -o DPkg::Lock::Timeout=300 update
            sudo apt-get -o DPkg::Lock::Timeout=300 install -y cmake build-essential libgl1-mesa-dev libglu1-mesa-dev
          else
            echo "Skipping apt dependency install on runners without passwordless sudo"
            python3 -m pip install --user $PIP_BREAK_SYSTEM_PACKAGES cmake
          fi
          # Always install a modern gcovr via pip (uses markupsafe.Markup, not jinja2.Markup)
          python3 -m pip install --user $PIP_BREAK_SYSTEM_PACKAGES 'gcovr>=7.2'
          python3 -m pip install --user $PIP_BREAK_SYSTEM_PACKAGES pytest pytest-cov hypothesis
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve CMake executable
        run: |
          if [ -x /usr/bin/cmake ]; then
            echo "CMAKE_BIN=/usr/bin/cmake" >> "$GITHUB_ENV"
          else
            echo "CMAKE_BIN=$(command -v cmake)" >> "$GITHUB_ENV"
          fi

      - name: Run Python contract tests with coverage
        run: |
          mkdir -p build
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest -p pytest_cov tests/test_architecture_dbc.py tests/test_math_properties.py \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:build/python-coverage.xml

      - name: Upload Python coverage data
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-data
          include-hidden-files: true
          path: |
            .coverage
            build/python-coverage.xml

      - name: Configure CMake
        run: |
          "$CMAKE_BIN" -S . -B build -DCMAKE_BUILD_TYPE=Debug -DQE_BUILD_DEMO=OFF -DQE_ENABLE_COVERAGE=ON

      - name: Build native test suite
        run: |
          "$CMAKE_BIN" --build build --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure -L unit

      - name: Run integration tests
        run: ctest --test-dir build --output-on-failure -L integration

      - name: Configure benchmarks
        run: |
          "$CMAKE_BIN" -S . -B build-bench -DCMAKE_BUILD_TYPE=Release -DQE_BUILD_DEMO=OFF -DQE_BUILD_BENCHMARKS=ON

      - name: Build benchmark probes
        run: |
          "$CMAKE_BIN" --build build-bench --target qe_math_benchmark --parallel

      - name: Run benchmark probes
        run: ctest --test-dir build-bench --output-on-failure -L benchmark

      - name: Generate coverage report
        run: |
          gcovr --root . \
            --filter src \
            --exclude tests \
            --xml-pretty --output build/coverage.xml \
            --html-details build/coverage.html \
            --print-summary

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-coverage
          path: |
            build/coverage.xml
            build/coverage.html

  # =============================================================================
  # RUST QUALITY GATE (Conditional)
  # =============================================================================
  # No-op until Rust code is added. Activates when Cargo.toml is present.
  # QuatEngine's math could be backed by the math-primitives Rust crate.
  # =============================================================================
  rust-quality-gate:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Rust changes
        id: rust-changes
        run: |
          if [ ! -f "Cargo.toml" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml found — Rust quality gate skipped (no Rust code yet)."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD || true)
            RUST_FILES=$(git diff --name-only "$BASE_SHA" HEAD -- '*.rs' 'Cargo.toml' '*/Cargo.toml' 'rust-toolchain.toml' || true)
          else
            RUST_FILES=$(git diff --name-only HEAD~1 HEAD -- '*.rs' 'Cargo.toml' '*/Cargo.toml' 'rust-toolchain.toml' || echo "")
          fi

          if [ -n "$RUST_FILES" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed Rust files:"
            echo "$RUST_FILES"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No Rust changes detected — skipping Rust quality gate."
          fi

      - name: Install Rust toolchain
        if: steps.rust-changes.outputs.has_changes == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        if: steps.rust-changes.outputs.has_changes == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format Check (rustfmt)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: cargo fmt --all -- --check

      - name: Lint (Clippy)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust Tests
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: cargo test

      - name: Security Audit (cargo-audit)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          cargo install cargo-audit --locked || true
          cargo audit
