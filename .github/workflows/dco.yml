name: DCO
on:
  pull_request:
    branches: [main]
jobs:
  dco:
    runs-on: d-sorg-fleet
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check commit signoffs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          missing=0
          while IFS= read -r commit; do
            if ! git log -1 --format=%B "$commit" | grep -Eiq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $commit is missing a DCO Signed-off-by trailer"
              missing=1
            fi
          done < <(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
