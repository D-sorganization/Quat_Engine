name: Heavy Integration Suite

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Select runner
        id: check
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          RUNNER_TARGET: ${{ vars.RUNNER_TARGET }}
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          if [ "$REPO_VISIBILITY" != "public" ]; then
            # Hosted runners are billed on a non-public repo, so routing is not a
            # preference here and RUNNER_TARGET deliberately does not apply.
            RUNNER=d-sorg-fleet
            WHY="repository is '${REPO_VISIBILITY:-unknown}'; hosted runners are metered"
          elif [ "$RUNNER_TARGET" = "local" ]; then
            RUNNER=d-sorg-fleet
            WHY="repository is public but RUNNER_TARGET=local"
          else
            RUNNER=ubuntu-latest
            WHY="repository is public; hosted runners are free and keep fork PRs off the fleet"
          fi
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"
          echo "Routing to $RUNNER ($WHY)."
  heavy-tests:
    timeout-minutes: 60
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install native toolchain
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y cmake build-essential gcovr libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure heavy integration build
        run: cmake -S . -B build-heavy -DCMAKE_BUILD_TYPE=Debug -DQE_BUILD_DEMO=OFF -DQE_ENABLE_COVERAGE=ON

      - name: Build integration targets
        run: cmake --build build-heavy --parallel

      - name: Run integration suite
        run: ctest --test-dir build-heavy --output-on-failure -L integration

      - name: Generate integration coverage report
        run: |
          gcovr --root . \
            --filter src \
            --exclude tests \
            --xml-pretty --output build-heavy/coverage.xml \
            --html-details build-heavy/coverage.html \
            --print-summary

      - name: Upload integration coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: heavy-integration-coverage
          path: |
            build-heavy/coverage.xml
            build-heavy/coverage.html
