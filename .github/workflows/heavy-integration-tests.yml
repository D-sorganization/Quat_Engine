name: Heavy Integration Suite

on:

jobs:

  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: self-hosted
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          ONLINE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
            --jq '[.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online — routing locally"
          else
            echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
            echo "No self-hosted runner — using GitHub-hosted"
          fi
  heavy-tests:
    needs: pick-runner
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential gcovr libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure heavy integration build
        run: cmake -S . -B build-heavy -DCMAKE_BUILD_TYPE=Debug -DQE_BUILD_DEMO=OFF -DQE_ENABLE_COVERAGE=ON

      - name: Build integration targets
        run: cmake --build build-heavy --parallel

      - name: Run integration suite
        run: ctest --test-dir build-heavy --output-on-failure -L integration

      - name: Generate integration coverage report
        run: |
          gcovr --root . \
            --filter src \
            --exclude tests \
            --xml-pretty --output build-heavy/coverage.xml \
            --html-details build-heavy/coverage.html \
            --print-summary

      - name: Upload integration coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: heavy-integration-coverage
          path: |
            build-heavy/coverage.xml
            build-heavy/coverage.html
